fedale_gridview:
  # Instant client-side i18n: ship both catalogs to the browser. The app's own
  # switcher (in the navbar) drives the grid, so the bundle's in-grid switcher
  # stays off (lang_switcher: false) — no duplicate switcher.
  i18n:
    locales: [en, it]
    default: en
    client_domain: Gridview
    lang_switcher: false

  # The former `defaults.options` bag was dissolved into topic siblings:
  # `display` (look & text), `behavior` (interaction) and `integration`.
  defaults:
    display:
      emptyText: "No records found"
      showThead: true
      showTfoot: true
      # layout:
      #   shell:    "{header} {dataview} {footer}"
      #   header:   "{globalSearch}"
      #   dataview: "{thead} {filter} {tbody} {tfoot}"
      #   footer:   "{pagination}"
    behavior:
      useTurbo: true
      maxQueryLength: 8000
    attributes: {}
#     class: "table table-striped"
#     container:
#       class: "table-responsive"

  gridviews:
    # Real-time updates (Mercure): observers of the User grid see other users'
    # create/update/delete reflected on-the-fly (signal + auto-refresh).
    # Enable per grid id (the entity short name lowercased). The User grid is a
    # full CRUD grid (UserController extends AbstractCrudGridController), so its
    # writes publish the signal.
    user:
      behavior:
        realtime:
          enabled: true
#   customer_list:
#     behavior:
#       globalSearch: ["c.code", "c.email"]
#     display:
#       layout:
#         dataview: "{tbody}"                  # body only, no thead/filter/tfoot
#         footer:   "{pagination}"
#       templates:
#         header: "@App/gridview/custom_header.html.twig"
#     attributes:
#       class: "table table-dark"
#       row:
#         class: "custom-row"
